name: Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Build package
      run: python -m build
    - name: Install package with test extras
      run: pip install -e ".[dev]" || pip install -e .
    - name: Install TypeScript extension deps
      run: cd doxtr_rag/pi_extension && npm install
    - name: Type-check (mypy --strict)
      run: python -m mypy
    - name: Type-check (tsc --strict)
      run: cd doxtr_rag/pi_extension && npx tsc --noEmit --strict
    - name: TypeScript unit tests (vitest)
      run: cd doxtr_rag/pi_extension && npx vitest run
    - name: Run unit tests with coverage (>=90%)
      run: python -m pytest -v --tb=short --cov=doxtr_rag --cov-fail-under=90
    - name: Verify import
      run: python -c "import doxtr_rag; print(doxtr_rag.__version__)"
